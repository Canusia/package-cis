<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                <div class="table-responsive">
                    <script>
                        $(document).ready(function() {
                            $('#tbl_registrations_summary').DataTable(
                            {
                                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    {
                                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                                        titleAttr: 'Export results to CSV'
                                    },
                                    {
                                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                                        titleAttr: 'Print'
                                    },
                                ],
                                'lengthMenu': [30, 50, 100],
                                'order': [[1, 'asc']],
                                'rowGroup': {
                                    dataSrc: ['highschool_name'],
                                    startRender: function (rows, group, level) {
                                        return '<h5 class="group-header-tab-' + level + '">' + group + '</h5>'
                                    },
                                    endRender: function ( rows, group, level ) {
                                        var total = rows
                                            .data()
                                            .pluck('count')
                                            .reduce( function (a, b) {
                                                return a+b
                                            }, 0);

                                            var count = rows
                                            .data().length

                                        return '<div class="group-footer-tab-'+level+'">Total '+group+': '+
                                                count + " / " + $.fn.dataTable.render.number(',', '.', 0, '').display( total ) + "</div>";
                                    },
                                },
                                'columnDefs': [
                                    {
                                        'searchable': false,
                                        'targets': [0],
                                        'visible': false,
                                    }
                                ],
                                'columns': [
                                    {
                                        data: 'highschool_name'
                                    },
                                    {
                                        data: 'course_name'
                                    },
                                    {
                                        data: 'status',
                                        'render': function (data, type, row, meta) {
                                            return row.status.toUpperCase()
                                        }
                                    },
                                    {
                                        data: 'count'
                                    }
                                ]
                            }
                        );
                        })
                    </script>
                    <table id="tbl_registrations_summary" class="table table-striped responsive grouped_table_2"
                        style="width:100%" data-ajax="{{ registration_summary_api_url }}">
                        <thead>
                            <tr>
                                <th data-data="highschool_name" data-name="highschool_name">High School</th>
                                <th data-data="course_name" data-name="course_name">Course</th>
                                <th data-data="status" data-name="status">Status</th>
                                <th data-data="count" data-name="count">Count</th>
                            </tr>
                        </thead>
                    </table>
                </div> <!-- end table-responsive -->
            </div>
        </div>
    </div>
</div>
