<script>
    jQuery(document).ready(function () {
        $('#tbl_course_notes').DataTable(
            {
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
            buttons: [
                {
                    extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                    text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                    titleAttr: 'Export results to CSV'
                },
                {
                    extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                    text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                    titleAttr: 'Print'
                },
            ],
                serverSide: true,
                processing: true,
                stateSave: true,
                language: {
                    'loadingRecords': '&nbsp;',
                },
                'lengthMenu': [30, 50, 100],
                'order': [[0, 'desc']],
                'ajax': {
                    url: '{{course_notes_api}}',
                    data: function (d) {
                        d.format = 'datatables';
                        d.course_id = '{{record.id}}';
                    }
                },
                'columns': [
                    {
                        'searchable': false,
                    },
                    {
                        'render': function (data, type, row, meta) {
                            let note = row.note

                            return note
                        }
                    },
                    {
                        'render': function (data, type, row, meta) {
                            return row.createdby.last_name + ", " +
                                row.createdby.first_name
                        }
                    }
                ]
            }
        );
    });

    jQuery(document).ready(function ($) {

        $(document).on("click", "a.delete_student_note", function () {

            if (!confirm("Are you sure you want to permanently delete this record and all the related information?"))
                return;

            $.blockUI();
            $.ajax({
                type: 'GET',
                url: "{% url 'cis:delete_student_note'%}",
                data: {
                    'note_id': $(this).attr('data-id')
                },
                success: function (response) {
                    $.unblockUI();
                    swal(
                        "",
                        response.message,
                        response.status
                    )
                    if (response.status == 'success') {
                        window.location.reload();
                    }
                }
            });
        });
    });
</script>
<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                <div class="text-right">
                    <a href="#notes" class="btn btn-sm btn-primary ajax-add_new"
                        data-parent="{{record.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="coursenote" data-updater=""><i
                            class="fa fas-light fa-plus-circle"></i>&nbsp;Add New Note</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="table-responsive">
                    <table style="width: 100%;" id="tbl_course_notes" class="table table-striped responsive"
                        style="width:100%" data-server-side="true">
                        <thead>
                            <tr>
                                <th data-data="createdon" data-name="createdon">Added On
                                </th>
                                <th data-data="note" data-name="note">Note
                                </th>
                                <th data-data="createdby.last_name" data-name="createdby.last_name">
                                    Added By
                                </th>
                            </tr>
                        </thead>
                    </table>
                </div> <!-- end table-responsive -->
            </div>
        </div>
    </div>
</div>
