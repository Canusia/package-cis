{% load crispy_forms_tags %}
<div class="">
    <div class="">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                <div class="table-responsive">
                    <table id="highschool_transcripts" class="table table-striped responsive"
                        style="width:100%" data-server-side="true" data-ajax="{{ transcripts_api_url }}">
                        <thead>
                            <tr>
                                <th data-data="uploaded_on" data-name="uploaded_on">Added On
                                </th>
                                <th data-data="uploaded_by.last_name" data-name="uploaded_by.last_name">Uploaded By</th>
                                <th data-data="description" data-name="description">Note
                                </th>
                                <th data-data="file_name" data-name="file_name">File</th>
                            </tr>
                        </thead>
                    </table>
                    <hr>
                    <h4>Add New File</h4>
                    <form action="" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ transcript_upload_form | crispy }}
                        <input type="hidden" name="action" value="upload_transcript">
                        <input type="submit" class="btn btn-primary btn-sm" name="add_transcript"
                            value="Add File">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        $('#highschool_transcripts').DataTable(
            {
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    {
                                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                                        titleAttr: 'Export results to CSV'
                                    },
                                    {
                                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                                        titleAttr: 'Print'
                                    },
                                ],
                'lengthMenu': [30, 50, 100],
                'columns': [
                    null,
                    {
                        'render': function (data, type, row, meta) {
                            return row.uploaded_by.last_name + ", " +
                                row.uploaded_by.first_name
                        }
                    },
                    null,
                    {
                        'render': function (data, type, row, meta) {
                            return "<a href='/ce/highschool/transcript/" + row.id + "'>" + row.file_name + "</a>"
                        }
                    }
                ]
            }
        );
    });
</script>
