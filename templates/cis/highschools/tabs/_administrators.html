<div class="card mb-4 border-top-0">
    <div class="card-body">
        <div class="table-responsive">
            <table id="highschool_administrators" class="table table-striped responsive"
                style="width:100%" data-server-side="true"
                data-ajax="{{ administrator_api_url }}">
                <thead>
                    <tr>
                        <th data-data="hsadmin.user.last_name"
                            data-name="hsadmin.user.last_name">Name
                        </th>
                        <th data-data="hsadmin.user.email" data-name="hsadmin.user.email">Email
                        </th>
                        <th data-data="position.name" data-name='position.name'>Role</th>
                        <th data-data="status" data-name='status'>Status</th>
                        <th data-data="id" data-name="id"></th>
                    </tr>
                </thead>
            </table>
        </div> <!-- end table-responsive -->
    </div>
</div>
<script>
    $(document).ready(function () {
        $('#highschool_administrators').DataTable(
            {
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    {
                                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                                        titleAttr: 'Export results to CSV'
                                    },
                                    {
                                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                                        titleAttr: 'Print'
                                    },
                                ],
                'lengthMenu': [30, 50, 100],
                'columns': [
                    {
                        'render': function (data, type, row, meta) {
                            return row.hsadmin.user.last_name + ", " +
                                row.hsadmin.user.first_name
                        }
                    },
                    null,
                    null,
                    null,
                    {
                        'searchable': false,
                        'orderable': false,
                        'render': function (data, type, row, meta) {
                            return "<a class='btn btn-sm btn-primary' href='" + row.hsadmin.ce_url + "'>View Details</a>"
                        }
                    }
                ]
            }
        );
    });
</script>
