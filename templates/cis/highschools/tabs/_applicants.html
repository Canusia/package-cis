<div class="">
    <div class="">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                <script>
                        var table_teacher_apps, table_active, table_reviewer;

                        $(document).ready(function () {
                        table_teacher_apps = $('#records_teacher_apps')
           .DataTable({
                "fnDrawCallback": function( oSettings ) {
                    $.unblockUI();
                },
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                buttons: [
                    {
                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                        titleAttr: 'Export results to CSV'
                    },
                    {
                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                        titleAttr: 'Print'
                    },
                ],
                ajax: '{{ teacher_app_api_url }}',
                serverSide: true,
                processing: true,
                stateSave: true,
                'lengthMenu': [30, 50, 100],
                'order': [[0, 'desc']],
                'columns': [
                    null,
                    {
                        'render': function (data, type, row, meta) {
                            return row.user.last_name + ', ' +
                                row.user.first_name
                        }
                    },
                    {
                        'render': function (data, type, row, meta) {
                            if (row.highschool == null)
                                return '';
                            return row.highschool.name
                        }
                    },
                    {
                        'searchable': false,
                        'orderable': false
                    },
                    {
                        'searchable': false,
                        'orderable': false
                    },
                    {
                        'searchable': false,
                        'orderable': false,
                        'render': function (data, type, row, meta) {
                            return "<a class='btn btn-sm btn-primary' href='" + row.ce_url + "'>Details</a>"
                        }
                    }
                ]
            }
        );
                        });
                </script>
                <table id="records_teacher_apps" class="table table-striped responsive" style="width:100%">
                    <thead>
                        <tr>
                            <th data-data="createdon" data-name='createdon'>Created On</th>
                            <th data-data="user.last_name" data-name="user.last_name">Name
                            </th>
                            <th data-data="highschool.name" data-name="highschool.name">High School
                            </th>
                            <th data-data="courses" data-name="courses">Course(s)
                            </th>
                            <th data-data="status" data-name="status">Status
                            </th>
                            <th data-data="ce_url" data-name='ce_url'><span
                                    class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>
