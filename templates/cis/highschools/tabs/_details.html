{% load crispy_forms_tags %}
<div class="">
    <div class="card border-top-0">
        <div class="card-body">
            <h5 class="card-title">High School Details</h5>
            <div class="card-text">

                <form action="" method="post">
                    {% csrf_token %}
                    {{ form | crispy }}
                    <input type="submit" class="btn btn-primary btn-sm" value="Update">&nbsp;
                    <input type="button" value="Delete" class="btn btn-danger btn-sm delete">
                    <script>
                        jQuery(document).ready(function ($) {
                            $("input.delete").on("click", function () {
                                if (!confirm("Are you sure you want to permanently delete this record?"))
                                    return;

                                $.blockUI();
                                $.ajax({
                                    type: 'GET',
                                    url: "{% url 'cis:delete_highschool' record.id%}",
                                    success: function (response) {
                                        $.unblockUI();
                                        swal({
                                            title: 'Success',
                                            text: response.message,
                                            icon: response.status
                                        }).then(
                                            (value) => {
                                                window.location = "{% url 'cis:highschools' %}";
                                            }
                                        )
                                    }
                                });
                            });
                        });
                    </script>
                </form>

                <script>
                    function do_ajax_action(action, record_id) {
                        url = "{%url 'cis:highschool_bulk_actions' %}"
                        let modal = "modal-bulk_actions"

                        let data = {
                            'action': action,
                            'record_id': record_id
                        }

                        $.ajax({
                            type: "GET",
                            url: url,
                            data: data,
                            success: function(response) {
                                $("#bulk_modal_content").html(response);
                                $("#" + modal).modal('show');
                            }
                        });
                    }

                </script>
            </div>
        </div>
    </div>
</div>
