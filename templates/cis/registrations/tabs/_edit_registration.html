{% load crispy_forms_tags %}
<div class="row">
    <div class="col-12">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                {% if messages %}
                <ul class="messages list-group mb-4">
                    {% for message in messages %}
                    <li{% if message.tags %} class="list-group-item {{ message.tags }}" {% endif %}>
                        {{ message }}
                        </li>
                        {% endfor %}
                </ul>
                {% endif %}
                <form action="" method="post">
                    {% csrf_token %}
                    {{ form | crispy }}
                    <input type="submit" class="btn btn-primary btn-sm" value="Update">
                    <input type="button" value="Delete" class="btn btn-danger btn-sm delete">
                    <script>
                        jQuery(document).ready(function ($) {
                            $("input.delete").on("click", function () {
                                if (!confirm("Are you sure you want to permanently delete this record?"))
                                    return;

                                $.blockUI();
                                $.ajax({
                                    type: 'GET',
                                    url: "{% url 'cis:delete_registration' record.id%}",
                                    success: function (response) {
                                        $.unblockUI();
                                        swal({
                                            title: 'Success',
                                            text: response.message,
                                            icon: response.status
                                        }).then(
                                            (value) => {
                                                if(window.frameElement !== null) {
                                                    window.location = "/ce/student/{{record.student.id}}"
                                                } else {
                                                    window.location = "{% url 'cis:registrations' %}";
                                                }
                                            }
                                        )
                                    }
                                });
                            });
                        });
                    </script>
                </form>

                <div class="clearfix">&nbsp;</div>
                <hr>
                <h5 class="card-title">Charge(s)</h5>
                <div class="bg-gray-100 text-dark mb-4 p-2">
                    {{record.charges_asHTML|safe}}
                </div>
                <hr>
                <h5 class="card-title">Registration Details</h5>
                <div class="bg-gray-100 text-dark">
                    {{record.asHTML|safe}}
                </div>
            </div>
        </div>
    </div>
</div>
