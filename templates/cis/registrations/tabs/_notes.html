<script>
    jQuery(document).ready(function () {
        $('#student_notes').DataTable(
            {
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                buttons: [
                    {
                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                        titleAttr: 'Export results to CSV'
                    },
                    {
                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                        titleAttr: 'Print'
                    },
                ],
                'lengthMenu': [30, 50, 100],
                'order': [[0, 'desc']],
                'columns': [
                    {
                        'searchable': false,
                    },
                    {
                        'render': function (data, type, row, meta) {
                            let note = row.note || '';
                            if (row.ethos_log_url) {
                                note += ' <a target="_blank" href="' + row.ethos_log_url + '" class="btn btn-sm btn-outline-secondary ml-2" title="View SIS log entry"><i class="fa fa-server"></i> SIS log</a>';
                            }
                            return note;
                        }
                    },
                    {
                        'searchable': false,
                        'render': function(data, type, row, meta) {
                            if(row.meta !== null) {
                                let type = '';
                                if(row.meta.type == 'public')
                                    return 'PUBLIC'

                                $(row.meta.type).each(function(index, element) {
                                    element = element.replace('_', ' ').toUpperCase()

                                    type += element + '<br>';
                                });
                                return type;
                            } else {
                                return 'PRIVATE';
                            }
                        }
                    },
                    {
                        'render': function (data, type, row, meta) {
                            return row.createdby.last_name + ", " +
                                row.createdby.first_name
                        }
                    }
                ]
            }
        );
    });
</script>
<div class="row">
    <div class="col-12">
        <div class="card mb-4 border-top-0">
            <div class="card-body">
                <div class="text-right">
                    <a href="#notes" class="btn btn-sm btn-primary ajax-add_new"
                        data-parent="{{record.student.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="studentnote" data-updater=""><i
                            class="fa fas-light fa-plus-circle"></i>&nbsp;Add New Note</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="table-responsive">
                    <table id="student_notes" class="table table-striped responsive"
                        style="width:100%" data-server-side="true" data-ajax="{{note_api_url}}">
                        <thead>
                            <tr>
                                <th data-data="createdon" data-name="createdon">Added On</th>
                                <th data-data="note" data-name="note">Note</th>
                                <th data-data="meta" data-name="meta">Type</th>
                                <th data-data="createdby.last_name" data-name="createdby.last_name">
                                    Added By
                                </th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
