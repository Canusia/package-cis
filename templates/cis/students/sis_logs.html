{% extends "cis/logged-base.html" %}
{%block title %}{{page_title}}{% endblock %}

{% load templatehelpers %}

{% block body %}

<main>
    <div class="">
        <div class="row">
            <div class="col-sm-6 col-xs-12">
                <h1 class="h3 mb-4 text-gray-800">{{page_title}}&nbsp;
                    
                </h1>
            </div>
        </div>

        <div class="table-responsive">
            <div class="">
                {% include "cis/messages.html" with messages=messages %}
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link active" data-toggle="tab" href="#all">All {{page_title}}</a>
                    </li>
                    <li class="nav-item d-none">
                        <a class="nav-link" data-toggle="tab" href="#archived">Archived</a>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane active " id="all">
                        <div class="bg-white border border-top-0">
                            <div class="col-12 pt-3 mb-3">
                                <table id="records_all" class="table table-striped responsive" style="width:100%">
                                    <thead>
                                        <tr>
                                            <th data-data="id" searchable="0" data-name="id">ID
                                            </th>
                                            <th data-data="sent_on" searchable="0" data-name="sent_on">Sent On
                                            </th>
                                            <th data-data="sexy_message_type" searchable="0" data-name="sexy_message_type">URL</th>
                                            <th data-data="response_code" searchable="0" data-name="response_code">Response Code</th>

                                            <th data-data="id" searchable="0" data-name="id">Actions</th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- end tab # records_active -->

                </div>
                <!-- end tab-content -->

                <script>
                    var table;
                    setInterval(function() {
                        table.ajax.reload(null, false);
                    }, 1000 * 60);

                    $(document).ready(function () {
                        // $('form.filter').rememberState()

                        let baseURL = '{{api_url}}'

                        $(document).on("change", "form.filter :input", function () {
                            load_data();
                        })

                        function load_data() {
                            let form = $('form.filter')
                            let newURL = baseURL + '&' + $(form).serialize();

                            table.ajax.url(newURL).load()
                        }


                        table = $('#records_all').DataTable(
                            {
                                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    {
                                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                                        titleAttr: 'Export results to CSV' 
                                    },
                                    { 
                                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                                        titleAttr: 'Print' 
                                    },
                                ],
                                'orderCellsTop': true,
                                'fixedHeader': true,
                                'order': [
                                    0, 'desc'
                                ],
                                ajax: '{{api_url}}',
                                serverSide: true,
                                processing: true,
                                // stateSave: true,
                                language: {
                                    'loadingRecords': '&nbsp;',
                                },
                                'lengthMenu': [30, 50, 100],
                                'columns': [
                                    null,
                                    {                                        
                                        'orderable': false,
                                        'searchable': false,
                                    },
                                    {
                                        'orderable': false,
                                        'searchable': false,
                                    },
                                    
                                    {
                                        'orderable': false,
                                        'searchable': false,
                                        'render': function (data, type, row, meta) {
                                            let col = row.response_code

                                            if(row.error_message) {
                                                col += "<br>" + row.error_message
                                            }

                                            return col
                                        }
                                    },
                                    {
                                        'orderable': false,
                                        'searchable': false,
                                        'render': function (data, type, row, meta) {
                                            return "<a class='btn btn-sm btn-primary record-details' refresh-target='table' href='" + row.ce_url + "'>View Details</a>"
                                        }
                                    }                                    
                                ]
                            }
                        );
                    });
                </script>
            </div>
        </div>

</main>

{% endblock %}
