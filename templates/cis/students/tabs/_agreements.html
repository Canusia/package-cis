<div class="card border-top-0">
    <div class="card-body">
        <div class="row">
            <div class="col-12">
                <table style="width: 100%;" id="tbl_student_agreements"
                    class="table table-striped dt-responsive" style="width: 100%;">
                    <thead>
                        <tr>
                            <th data-data="term.code" data-name="term.code">Term</th>
                            <th data-data="student_signed_on" data-name="student_signed_on">Signed On</th>
                            <th data-data="student_signature" data-name="student_signature">Signature</th>
                            <th data-data="id" data-name="id"></th>
                        </tr>
                    </thead>
                </table>
                <script>
                    $(document).ready(function () {
                        let baseURL = '{{agreements_url}}'
                        var table = $('#tbl_student_agreements').DataTable({
                            dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                            buttons: [
                                { extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV', titleAttr: 'Export results to CSV' },
                                { extend: 'print', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-print text-white"></i>&nbsp;Print', titleAttr: 'Print' },
                            ],
                            ajax: '{{agreements_url}}',
                            searching: false,
                            serverSide: true,
                            processing: true,
                            stateSave: true,
                            initComplete: function(settings, json) { table.columns.adjust() },
                            language: { 'loadingRecords': '&nbsp;' },
                            'lengthMenu': [30, 50, 100],
                            'columns': [
                                { 'render': function(data, type, row, meta) { return row.term.label } },
                                { 'render': function(data, type, row, meta) { return row.student_signed_on } },
                                { 'orderable': false, 'searchable': false },
                                { 'render': function(data, type, row, meta) {
                                    return '<a data-action="delete_student_agreement" href="#agreements" data-id="' + row.id + '" class="delete_record btn btn-sm btn-danger"><i class="fa fa-trash"></i></a>'
                                }}
                            ]
                        });
                    });
                </script>
            </div>
        </div>
    </div>
</div>

<div class="card bg-gray-200 mt-4 p-2 pt-4">
    <form>
        <div class="form-group row">
            <div class="col-sm-6">
                <select class="form-control" name="term">
                    {% for c in terms %}
                    <option value="{{c.id}}">{{c.label}} {{c.year}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-sm-3">
                <input type="button" data-action='mark_student_consent_recv'
                    value="Mark as Received" name="get_link"
                    class="form-control btn btn-sm btn-info">
            </div>
        </div>
        <input type="hidden" name="id" value="{{record.id}}">
    </form>
</div>
