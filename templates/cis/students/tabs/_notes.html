<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body">
                <div class="text-right">
                    <a href="#notes" class="btn btn-sm btn-primary ajax-add_new"
                        data-parent="{{record.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="studentnote" data-updater=""><i
                            class="fa fas-light fa-plus-circle"></i>&nbsp;Add New Note</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="table-responsive">
                    <table style="width: 100%;" id="student_notes" class="table table-striped responsive"
                        style="width:100%" data-server-side="true" data-ajax="{{note_api_url}}">
                        <thead>
                            <tr>
                                <th data-data="createdon" data-name="createdon">Added On</th>
                                <th data-data="note" data-name="note">Note</th>
                                <th data-data="meta" data-name="meta">Type</th>
                                <th data-data="createdby.last_name" data-name="createdby.last_name">Added By</th>
                                <th data-data="id" data-name="id"></th>
                            </tr>
                        </thead>
                    </table>
                </div>
                <script>
                    (function() {
                        var tbl_student_notes = $('#student_notes').DataTable({
                            dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                            buttons: [
                                { extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV', titleAttr: 'Export results to CSV' },
                                { extend: 'print', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-print text-white"></i>&nbsp;Print', titleAttr: 'Print' },
                            ],
                            'lengthMenu': [30, 50, 100],
                            'order': [[0, 'desc']],
                            'columns': [
                                { 'searchable': false },
                                { 'render': function(data, type, row, meta) {
                                    let note = row.note;
                                    if (row.media !== null) {
                                        note += '<br><br>' + "<a target='_blank' href='" + row.media + "' class='btn btn-sm btn-primary'>View Attachment</a>";
                                    }
                                    return note;
                                }},
                                { 'searchable': false, 'render': function(data, type, row, meta) {
                                    if (row.meta !== null) {
                                        let type = '';
                                        $(row.meta.type).each(function(index, element) {
                                            element = element.replace('_', ' ').toUpperCase();
                                            type += element + '<br>';
                                        });
                                        return type;
                                    } else { return 'PRIVATE'; }
                                }},
                                { 'render': function(data, type, row, meta) {
                                    return row.createdby.last_name + ", " + row.createdby.first_name;
                                }},
                                { 'orderable': false, 'searchable': false,
                                  'render': function(data, type, row, meta) {
                                    return '<a href="#notes" data-id="' + row.id + '" class="delete_student_note btn btn-sm btn-danger"><i class="fa fa-trash"></i></a>';
                                }}
                            ]
                        });

                        window._tbl_student_notes = tbl_student_notes;
                    })();
                </script>
            </div>
        </div>
    </div>
</div>
