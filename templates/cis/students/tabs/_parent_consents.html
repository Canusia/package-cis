<div class="card border-top-0">
    <div class="card-body">
        <div class="row">
            <div class="col-12">
                <table id="tbl_parent_consents" class="table table-striped dt-responsive" style="width: 100%;">
                    <thead>
                        <tr>
                            <th data-data="term.code" data-name="term.code">Term</th>
                            <th data-data="parent_signed_on" data-name="parent_signed_on">Parent Signed On</th>
                            <th data-data="parent_signature" data-name="parent_signature">Signature</th>
                            <th data-data="id" data-name="id"></th>
                        </tr>
                    </thead>
                </table>
                <script>
                    jQuery(document).ready(function ($) {
                        $(document).on("click", "a.delete_record", function () {
                            if (!confirm("Are you sure you want to permanently delete this record?"))
                                return;
                            $.blockUI();
                            $.ajax({
                                type: 'GET',
                                url: '{{ student_ajax_url }}',
                                data: { 'record_id': $(this).attr('data-id'), 'action': $(this).attr('data-action') },
                                success: function(response) {
                                    $.unblockUI();
                                    swal("", response.message, response.status);
                                    if (response.status == 'success') { window.location.reload(); }
                                }
                            });
                        });

                        $('input[name=get_link]').click(function () {
                            let form = $(this).closest('form');
                            $.get({
                                url: '{{ student_ajax_url }}',
                                data: form.serialize() + '&action=' + $(this).data('action'),
                                success: function(response) {
                                    var span = document.createElement('span');
                                    span.innerHTML = response.message;
                                    swal({ title: '', content: span, icon: 'success' });
                                }
                            });
                        });

                        $(document).ready(function () {
                            let baseURL = '{{parent_consents_url}}';
                            var table = $('#tbl_parent_consents').DataTable({
                                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    { extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV', titleAttr: 'Export results to CSV' },
                                    { extend: 'print', className: 'btn btn-sm btn-primary text-white text-light', text: '<i class="fas fa-print text-white"></i>&nbsp;Print', titleAttr: 'Print' },
                                ],
                                ajax: '{{parent_consents_url}}',
                                serverSide: true,
                                searching: false,
                                processing: true,
                                initComplete: function(settings, json) { table.columns.adjust() },
                                stateSave: true,
                                language: { 'loadingRecords': '&nbsp;' },
                                'lengthMenu': [30, 50, 100],
                                'columns': [
                                    { 'width': '50%', 'render': function(data, type, row, meta) { return row.term.label } },
                                    { 'width': '50%', 'render': function(data, type, row, meta) { return row.parent_signed_on } },
                                    { 'searchable': false, 'orderable': false },
                                    { 'render': function(data, type, row, meta) {
                                        return '<a data-action="delete_parent_consent" href="#parent_consents" data-id="' + row.id + '" class="delete_record btn btn-sm btn-danger"><i class="fa fa-trash"></i></a>'
                                    }}
                                ]
                            });
                        });
                    });
                </script>
                <div class="card bg-gray-200 mt-4 p-2 pt-4">
                    <form>
                        <div class="form-group row">
                            <div class="col-sm-6">
                                <select class="form-control" name="term">
                                    {% for c in terms %}
                                    <option value="{{c.id}}">{{c.label}} {{c.year}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <input type="button" data-action='get_parent_consent_link' value="Get Link" name="get_link" class="btn btn-sm btn-primary">&nbsp;
                                <input type="button" data-action='send_parent_consent_link' value="Send Link in Email" name="get_link" class="btn btn-sm btn-primary">&nbsp;
                                <input type="button" data-action='waive_parent_consent' value="Mark as Received" name="get_link" class="btn btn-sm btn-info">
                            </div>
                        </div>
                        <input type="hidden" name="id" value="{{record.id}}">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
