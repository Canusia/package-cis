<div class="card border-top-0">
    <div class="card-body">
        <div class="row ">
            <div class="col-12">
                <table style="width: 100%;" id="tbl_files" class="table table-striped">
                    <thead>
                        <tr>
                            <th data-data="uploaded_on" data-name="uploaded_on">Uploaded On
                            </th>
                            {% if show_student_details %}
                            <th data-data="student.user.last_name" data-name="student.user.last_name">Student
                            </th>
                            {% endif %}
                            <th data-data="term" data-name="term">Term
                            </th>
                            <th data-data="description" data-name="description">Note
                            </th>
                            <th data-data="media" data-name="media">File
                            </th>
                            <th data-data="id" data-name="id">
                            </th>
                            {% if show_student_details %}

                            <th data-data="student.ce_url" data-name='student.ce_url'><span class="sr-only">Actions</span></th>
                            {% endif %}
                        </tr>
                    </thead>
                </table>

                <script>
var tbl_files;

jQuery(document).ready(function ($) {

    tbl_files = $('#tbl_files').DataTable(
                {
                    dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                    buttons: [
                        {
                            extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                            titleAttr: 'Export results to CSV'
                        },
                        {
                            extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                            titleAttr: 'Print'
                        },
                    ],
                    ajax: {
                        url: '{{support_docs_url}}',
                        data: function (d) { 

                        }
                    },
                    order: [[0, 'desc']],
                    serverSide: true,
                    processing: true,
                    stateSave: true,
                    language: {
                        'loadingRecords': '&nbsp;',
                    },
                    'lengthMenu': [30, 50, 100],
                    'columns': [
                        {
                            'render': function (data, type, row, meta) {
                                return row.uploaded_on
                            }
                        },

                        {% if show_student_details %}
                        {
                            'render': function (data, type, row, meta) {
                                return row.student.user.last_name + ', ' + row.student.user.first_name;
                            }
                        },
                        {% endif %}
                        {
                            'render': function (data, type, row, meta) {
                                return row.term.label;
                            }
                        },
                        null,
                        {
                            'render': function (data, type, row, meta) {
                                return "<a class='' target='_blank' href='" + row.media + "'>Download</a>"
                            }
                        },
                        {
                            'render': function (data, type, row, meta) {
                                return "<a class='delete-upload btn btn-sm btn-danger' href='#' data-id='" + row.id + "'>Delete</a>"
                            }
                        },
                        {% if show_student_details %}
                        {
                            'searchable': false,
                            'orderable': false,
                            'render': function (data, type, row, meta) {
                                return "<a class='btn btn-sm btn-primary record-details' href='" + row.student.ce_url + "'>View Details</a>"
                            }
                        }
                        {% endif %}
                    ]
                }
            );

            $(document).on("click", ".delete-upload", function () {
                if (confirm("Are you sure you want to delete this record?")) {
                    let ajaxurl = "/ce/student/delete/support_doc/";
                    {% if is_student %}
                        ajaxurl = "/student/support_doc?action=delete&id=";
                    {% endif %}
                    $.ajax({
                        type: "GET",
                        url: ajaxurl + $(this).attr("data-id"),
                        success: function (response) {
                            if (response.status == 'success') {
                                tbl_files.ajax.reload(null, false);
                            } else {
                                alert("There was an error while deleting record")
                            }
                        }
                    });
                }
            });
});
                </script>
            </div>
        </div>
    </div>
</div>
