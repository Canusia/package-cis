{% load crispy_forms_tags %}
<style>
    .summary-card {
        border-radius: 0.75rem;
        transition: border 0.15s ease-in-out;
    }
    .summary-card .icon-wrapper {
        width: 48px;
        height: 48px;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
    }
    .summary-card .icon-wrapper.credit {
        background-color: #e6f4ea;
        color: #1cc88a;
    }
    .summary-card .icon-wrapper.primary {
        background-color: #e8eaf6;
        color: #4e73df;
    }
</style>
<div class="card mb-4 border-top-0">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-xl-6 col-lg-6 col-md-6 mb-3">
                <div class="card summary-card shadow-sm h-100" style="border:none; cursor:pointer;" data-status="">
                    <div class="card-body d-flex align-items-center p-3">
                        <div class="icon-wrapper primary mr-3">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="flex-grow-1 text-nowrap">
                            <div class="font-weight-bold text-dark">Total</div>
                            <div class="small text-muted">All Students</div>
                        </div>
                        <div class="ml-3 text-right">
                            <span class="h5 mb-0 font-weight-bold text-primary">{{ roster_total }}</span>
                        </div>
                    </div>
                </div>
            </div>
            {% for badge in roster_badges %}
            <div class="col-xl-6 col-lg-6 col-md-6 mb-3">
                <div class="card summary-card shadow-sm h-100" style="border:none; cursor:pointer;" data-status="{{ badge.status_code }}">
                    <div class="card-body d-flex align-items-center p-3">
                        <div class="icon-wrapper credit mr-3">
                            <i class="fas fa-circle"></i>
                        </div>
                        <div class="flex-grow-1 text-nowrap">
                            <div class="font-weight-bold text-dark">{{ badge.status }}</div>
                            <div class="small text-muted">{{ badge.count }} Student{{ badge.count|pluralize }}</div>
                        </div>
                        <div class="ml-3 text-right">
                            <span class="h5 mb-0 font-weight-bold text-success">{{ badge.count }}</span>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% include registrations_table.partial_template with config=registrations_table %}
    </div>
</div>

<script>
    $(document).ready(function () {
        $('#students .summary-card').on('click', function () {
            var table = $('#tbl_class_registrations').DataTable();
            var status = $(this).data('status');
            var isActive = $(this).hasClass('border-primary');
            $('#students .summary-card').removeClass('border-primary border-2').css('border', 'none');
            if (!isActive && status) {
                $(this).css('border', '2px solid #4e73df').addClass('border-primary border-2');
                table.column(3).search(status).draw();
            } else {
                table.column(3).search('').draw();
            }
        });
    });
</script>
