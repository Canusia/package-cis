{% extends "cis/logged-base.html" %}
{%block title %}{{page_title}}{% endblock %}

{% load templatehelpers %}

{% block body %}

<main>
    <div class="">
        <div class="row">
            <div class="col-sm-6 col-xs-12">
                <h1 class="h3 mb-4 text-gray-800">{{page_title}}&nbsp;
                    
                </h1>
            </div>
        </div>

        <div class="table-responsive">
            <div class="">
                
                <div class="">
                    <div class="card" id="all">
                        <div class="card-body">
                            <div class="">
                                <table id="records_all" class="table table-striped" style="width:100%">
                                    <thead>
                                        <tr>
                                            <th data-data="run_scheduled_for" data-name="run_scheduled_for">Scheduled For
                                            </th>
                                            <th data-data="cron.command" data-name="cron.command">Task</th>
                                            <th data-name="run_started_on" data-data="run_started_on">Started On</th>
                                            <th data-name="run_completed_on" data-data="run_completed_on">Completed On</th>
                                            <th data-data="log_file" data-name="log_file">Log
                                            </th>
                                            <th data-data="summary" data-name="summary">Summary
                                            </th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                    </div>
                    <!-- end tab # records_active -->

                </div>
                <!-- end tab-content -->

                <script>
                    var table;
                    setInterval(function() {
                        var selectedRows = table.rows({ selected: true });
                        
                        if(selectedRows.count() <= 0)
                            table.ajax.reload(null, false);
                    }, 5000 * 60);

                    $(document).ready(function () {
                        let baseURL = '{{api_url}}'

                        $(document).on("change", "form.filter :input", function () {
                            load_data();
                        })

                        function load_data() {
                            let form = $('form.filter')
                            let newURL = baseURL + '&' + $(form).serialize();

                            table.ajax.url(newURL).load()
                        }


                        table = $('#records_all')
                           .DataTable({
                                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                                buttons: [
                                    {
                                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                                        titleAttr: 'Export results to CSV' 
                                    },
                                    { 
                                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                                        titleAttr: 'Print' 
                                    },
                                ],
                                'order': [[0, 'desc']],
                                'orderCellsTop': true,
                                'fixedHeader': true,
                                ajax: '{{api_url}}',
                                serverSide: true,
                                processing: true,
                                language: {
                                    'loadingRecords': '&nbsp;',
                                },
                                'lengthMenu': [30, 50, 100],
                                'columns': [
                                    null,
                                    null,
                                    null,
                                    null,
                                    {
                                        'render': function (data, type, row, meta) {
                                            if(row.log_file !== null)
                                                return "<a href='" + row.log_file + "'>Download File</a>"
                                            return '';
                                        }
                                    },
                                    {
                                        'searchable': false,
                                        'orderable': false
                                    }
                                ]
                            }
                        );
                    });
                </script>
            </div>
        </div>

</main>

{% endblock %}
