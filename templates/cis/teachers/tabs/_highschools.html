<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body">
                <p class="alert alert-info">Once you update a high school status please update
                    the course stage accordingly.</p>
                <div class="text-right">
                    <a href="#" class="btn btn-sm btn-primary ajax-add_new"
                        data-parent="{{record.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="teacherhighschool" data-updater=""><i
                            class="fa fas-light fa-plus-circle"></i>&nbsp;Add New High
                        School</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="table-responsive">
                    <table class="table dataTable table-striped">
                        <thead>
                            <tr>
                                <th>Created On</th>
                                <th>High School</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for r in highschools %}
                            <tr>
                                <td>{{r.created_at}}</td>
                                <td>
                                    <a href="javascript:void(0)" class="ajax-add_new"
                                        data-parent="{{record.id}}" data-id="{{r.id}}"
                                        data-modal="modal-add_new"
                                        data-model="teacherhighschool"
                                        data-updater="">{{r.highschool.name}}</a>
                                </td>
                                <td>{{r.status}}</td>
                                <td>
                                    <a href="javascript:void(0)" class="ajax-add_new"
                                        data-parent="{{record.id}}" data-id="{{r.id}}"
                                        data-modal="modal-add_new"
                                        data-model="teacherhighschool" data-updater="">Edit</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
