<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body">
                <div class="text-right">
                    <a href="javascript:void(0)" class="btn btn-primary ajax-add_new"
                        data-parent="{{record.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="teachercoursecertificate" data-updater=""><i
                            class="fa fas-light fa-plus-circle"></i>&nbsp;Add New</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="">
                    <table style="width: 100%;" class="table table-striped"
                        id="tbl_teacher_course_certificates">
                        <thead>
                            <tr>
                                <th data-data="course.name" data-name="course.name">Course</th>
                                <th data-data="teacher_highschool.highschool.name" data-name="teacher_highschool.highschool.name">High School</th>
                                <th data-data="status" data-name="status">Status</th>
                                <th data-data="since" data-name="since">Since</th>
                                <th data-data="renewal_due_date">Renewal Due</th>
                                <th data-data="expires_on">Expires</th>
                                <th data-data="last_renewed_on">Last Renewed</th>
                                <th data-data="highschool_course_name" data-name="highschool_course_name">HS Course Name</th>
                                <th data-data="id" data-name="id"></th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var tbl_teacher_course_certificates;

    jQuery(document).ready(function ($) {
        tbl_teacher_course_certificates = $('#tbl_teacher_course_certificates').DataTable(
            {
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                buttons: [
                    {
                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                        titleAttr: 'Export results to CSV'
                    },
                    {
                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                        titleAttr: 'Print'
                    },
                ],
                ajax: {
                    url: '{{teacher_course_certificates_api}}',
                    data: function (d) {
                        d.format = 'datatables';
                        d.teacher_id = '{{record.id}}';
                    }
                },
                serverSide: true,
                processing: true,
                stateSave: true,
                language: {
                    'loadingRecords': '&nbsp;',
                },
                'lengthMenu': [30, 50, 100],
                'columns': [
                    null,
                    null,
                    null,
                    null,
                    null,
                    null,
                    null,
                    null,
                    {
                        'render': function (data, type, row, meta) {
                            return "<a class='ajax-add_new btn btn-sm btn-danger' data-modal='modal-add_new' href='#courses' data-model='teachercoursecertificate' data-parent='{{record.id}}' data-id='" + row.id + "'>Edit</a>"
                        }
                    }
                ]
            }
        );
    });
</script>
