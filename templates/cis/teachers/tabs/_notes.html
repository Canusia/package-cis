<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body">
                <div class="text-right">
                    <a href="#notes" class="btn btn-sm btn-primary ajax-add_new"
                        data-parent="{{record.id}}" data-id="-1" data-modal="modal-add_new"
                        data-model="teachernote" data-table-updater="tbl_teacher_notes"
                        data-updater=""><i class="fa fas-light fa-plus-circle"></i>&nbsp;Add New
                        Note</a>
                </div>
                <div class="clearfix">&nbsp;</div>
                <div class="table-responsive">
                    <table style="width: 100%;" id="tbl_teacher_notes"
                        class="table table-striped">
                        <thead>
                            <tr>
                                <th data-name="createdon" data-data="createdon">Added On</th>
                                <th data-name="note" data-data="note">Note</th>
                                <th data-name="type" data-data="type">Type</th>
                                <th data-name="createdby" data-data="createdby">Added By</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var tbl_teacher_notes;

    jQuery(document).ready(function ($) {
        tbl_teacher_notes = $("#tbl_teacher_notes").DataTable({
            dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
            buttons: [
                {
                    extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                    text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                    titleAttr: 'Export results to CSV'
                },
                {
                    extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                    text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                    titleAttr: 'Print'
                },
            ],
            'lengthMenu': [30, 50, 100],
            'order': [[0, 'desc']],
            ajax: {
                url: '{{teacher_notes_api}}',
                data: function (d) {
                    d.format = 'datatables';
                    d.teacher_id = '{{record.id}}'
                }
            },
            'columns': [
                {
                    'searchable': false,
                },
                {
                    'render': function (data, type, row, meta) {
                        let note = row.note
                        if (row.media !== null) {
                            note += '<br><br>' + "<a target='_blank' href='" + row.media + "' class='btn btn-sm btn-primary'>View Attachment</a>";
                        }

                        return note
                    }
                },
                {
                    'searchable': false,
                    'render': function (data, type, row, meta) {
                        if (row.meta !== null) {
                            let type = '';
                            $(row.meta.type).each(function (index, element) {
                                element = element.replace('_', ' ').toUpperCase()

                                type += element + '<br>';
                            });
                            return type;
                        } else {
                            return 'PRIVATE';
                        }
                    }
                },
                {
                    'render': function (data, type, row, meta) {
                        return row.createdby.last_name + ", " +
                            row.createdby.first_name
                    }
                }
            ]
        });
    });
</script>
