<div class="row">
    <div class="col-12 bg-gray-100">
        <div class="card mb-4 border-top-0">
            <div class="card-body ">
                <div class="float-right mb-3"><a href="#courses"
                    class="btn btn-sm btn-primary ajax-add_new" data-parent="{{record.id}}"
                    data-id="-1" data-modal="modal-add_new" data-model="faculty_course_administrator"
                    data-updater=""><i class="fa fas-light fa-plus-circle"></i>&nbsp;Add New</a></div>
                <div class="clearfix">&nbsp;</div>
                <table id="table_course_administrator" class="table table-striped responsive grouped_table_2" style="width:100%">
                    <thead>
                        <tr>
                            <th data-data="course.name" data-name="course.name">Course</th>
                            <th data-data="role" data-name="role">Role</th>
                            <th data-data="status" data-name="status">Status</th>
                            <th data-data="id" data-name='id'><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
jQuery(function ($) {
    var table_course_administrator = $('#table_course_administrator').DataTable({
        select: {
            style: 'os',
            selector: 'td:first-child'
        },
        rowId: 'id',
        dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
        buttons: [
            {
                extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                titleAttr: 'Export results to CSV'
            },
            {
                extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                titleAttr: 'Print'
            },
            {
                className: 'btn btn-sm btn-primary text-white text-light',
                text: '<i class="fas fa-edit text-white"></i>&nbsp;Change Status',
                titleAttr: 'Change Status',
                action: function (e, dt, node, config) {
                    do_bulk_action('change_course_administrator_status', dt)
                }
            },
        ],
        'rowGroup': {
            dataSrc: ['course.name'],
            startRender: function (rows, group, level) {
                return '<h5 class="group-header-tab-' + level + '">' + group + '</h5>'
            },
            endRender: function (rows, group, level) {
                var total = rows
                    .data()
                    .reduce(function (a, b) {
                        return a + 1
                    }, 0);

                return '<div class="group-footer-tab-' + level + '">Total ' + group + ' - ' +
                    $.fn.dataTable.render.number(',', '.', 0, '').display(total) + '</div>';
            },
        },
        ajax: '{{ course_administrator_url }}',
        serverSide: true,
        processing: true,
        stateSave: true,
        'columnDefs': [
            {
                'targets': [0],
                'visible': false,
            }
        ],
        'lengthMenu': [30, 50, 100],
        'order': [[0, 'asc']],
        'columns': [
            null,
            null,
            null,
            {
                'searchable': false,
                'orderable': false,
                'render': function (data, type, row, meta) {
                    return '<a href="#courses" class="btn btn-sm btn-primary ajax-add_new" data-parent="' + '{{record.id}}" data-id="' + row.id + '" data-modal="modal-add_new" data-model="faculty_course_administrator" data-updater="">Edit</a>'
                }
            }
        ]
    });

    // Preserved from the page-level script: the modal-close handler in
    // cis/staticfiles/js/main.js calls window.refreshTable after a save.
    window.refreshTable = function () {
        table_course_administrator.rows({ selected: true }).deselect();
        table_course_administrator.ajax.reload(null, false);
    };

    setInterval(function () {
        if (!table_course_administrator.rows('.selected').any()) {
            table_course_administrator.ajax.reload(null, false);
        }
    }, 5000 * 60);
});
</script>
